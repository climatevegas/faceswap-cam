name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Install CocoaPods
      run: sudo gem install cocoapods

    - name: Install dependencies
      run: |
        cd FaceswapiOS
        pod install

    - name: Build for simulator
      run: |
        cd FaceswapiOS
        xcodebuild \
          -workspace FaceswapCam.xcworkspace \
          -scheme FaceswapCam \
          -sdk iphonesimulator \
          -configuration Debug \
          build

    - name: Build unsigned IPA
      run: |
        cd FaceswapiOS
        xcodebuild \
          -workspace FaceswapCam.xcworkspace \
          -scheme FaceswapCam \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          build

    - name: Create IPA
      run: |
        mkdir -p Payload
        cp -r FaceswapiOS/build/Release-iphoneos/FaceswapCam.app Payload/
        zip -r FaceswapCam.ipa Payload
        rm -rf Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: FaceswapCam-ipa
        path: FaceswapCam.ipa
        retention-days: 30
