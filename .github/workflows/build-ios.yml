name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Install CocoaPods
      run: sudo gem install cocoapods

    - name: Show project structure
      run: |
        pwd
        ls -la
        ls -la *.xcodeproj 2>/dev/null || echo "No xcodeproj found"

    - name: Install dependencies
      run: |
        pwd
        pod install || echo "Pod install completed with warnings"

    - name: Build for device (unsigned)
      run: |
        xcodebuild \
          -scheme FaceswapCam \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_ENTITLEMENTS="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          build

    - name: Create IPA
      run: |
        APP_PATH=$(find build -name "FaceswapCam.app" -type d | head -1)
        echo "Found app at: $APP_PATH"
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        zip -r FaceswapCam.ipa Payload
        rm -rf Payload
        ls -lh FaceswapCam.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: FaceswapCam-ipa
        path: FaceswapCam.ipa
        retention-days: 30
